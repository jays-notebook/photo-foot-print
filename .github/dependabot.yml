version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Revisit major upgrades when svelte-check supports TypeScript 7+.
      # Compatible TypeScript 6 minor/patch updates remain enabled.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      svelte-tooling:
        patterns: ['svelte', 'svelte-check', '@sveltejs/*', '@tsconfig/svelte', 'typescript', 'vite', 'vitest', '@vitest/*']
      tauri:
        patterns: ['@tauri-apps/*']
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      tauri:
        patterns: ['tauri', 'tauri-*', 'wry', 'tao']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

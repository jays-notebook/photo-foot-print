[workspace]
resolver = "2"
members = [
    "crates/src-tauri",
    "crates/pfp-exif",
    "crates/pfp-photos",
    "crates/pfp-tiles",
    "crates/pfp-state",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["jay <jykim.loa2000@gmail.com>"]
rust-version = "1.99.1"

[workspace.dependencies]
# The TIFF preflight mirrors this parser; review it before changing this pin.
little_exif = "=0.6.23"
kamadak-exif = "0.6.1"

# Atomic write
tempfile = "3"
libc = "0.2"

# Errors / serde
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Tauri (used only by the desktop host)
tauri = { version = "2.12.5", features = [] }
tauri-build = "2.7.4"

# Phase 2 — image pipeline + state + dialog
image = { version = "0.25", default-features = false, features = ["jpeg"] }
fast_image_resize = "6"
sha2 = "0.10"
dirs = "7"
tauri-plugin-dialog = "2.8.4"

# Phase 3 — HTTP client for OSM tile fetch (pfp-tiles)
# Note: reqwest 0.13.x renamed the rustls-only feature from `rustls-tls` (0.12) to `rustls` (0.13).
# Intent preserved: rustls only, no native-tls, no system OpenSSL dep.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }

[profile.release]
strip = true
lto = "thin"

[package]
name = "pfp-exif"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
little_exif = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
tempfile = { workspace = true }   # Plan 03: sibling NamedTempFile in atomic::write_via_temp

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }       # Plan 03: libc::fcntl(F_FULLFSYNC) on macOS

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[features]
default = []
# Cross-crate-reachable fault-injection hook for the durability integration test.
# NEVER ship as a default feature -- production builds must not include the panic point.
# Enabled explicitly by `cargo test --features fault-injection` (Makefile target test-fault).
fault-injection = []

[dev-dependencies]
kamadak-exif = { workspace = true }   # cross-check reader for round_trip integration test
tempfile = { workspace = true }       # round_trip + makernote_diff create temp working JPEGs

[package]
name = "photo-foot-print"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "A native macOS desktop app for one-photo-at-a-time geotagging of camera JPEGs."
default-run = "photo-foot-print"

[lib]
# Tauri 2 mobile-friendly default; matches v2.tauri.app project structure docs.
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true, features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Phase 1 lib crate dep -- only pfp-exif is implemented this phase. Phase 2
# will add `pfp-photos = { path = "../pfp-photos" }` and so on.
pfp-exif = { path = "../pfp-exif" }

[dev-dependencies]
# For the headless ipc_smoke integration test.
tempfile = { workspace = true }

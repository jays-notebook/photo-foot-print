[package]
name = "photo-foot-print"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "A native macOS desktop app for one-photo-at-a-time geotagging of camera JPEGs."
default-run = "photo-foot-print"

[lib]
# Tauri 2 mobile-friendly default; matches v2.tauri.app project structure docs.
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true, features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Phase 2 -- folder + photo list dependencies.
tauri-plugin-dialog = { workspace = true }
sha2 = { workspace = true }                     # for path-hash id used by the pfp-thumb:// id-map
pfp-exif = { path = "../pfp-exif" }
pfp-photos = { path = "../pfp-photos" }
pfp-state = { path = "../pfp-state" }

# Tokio is pulled transitively by tauri's `default` runtime feature, but we
# need explicit Semaphore + spawn_blocking access from our async commands.
tokio = { version = "1", features = ["sync", "rt", "time"] }

# HTTP types for the URI scheme handler responses.
http = "1"

[dev-dependencies]
# For the headless ipc_smoke integration test.
tempfile = { workspace = true }
